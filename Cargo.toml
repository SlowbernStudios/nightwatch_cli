[package]
name = "nightwatch-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "A procedural maintenance comedy that teaches a small Vim vocabulary"

[[bin]]
name = "nightwatch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
